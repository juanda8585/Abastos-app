server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial fallback configuration for Single Page Applications (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Optional proxy setup for backend API calls if needed later
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}