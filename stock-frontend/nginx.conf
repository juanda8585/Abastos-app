server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial fallback configuration for Single Page Applications (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Forward API + Swagger calls to the backend container.
    # The frontend uses relative URLs (/api/...), so the app works from any
    # machine on the network without baking an IP address into the bundle.
    # Longest-prefix match means /api/... never falls through to try_files.
    location /api {
        proxy_pass http://backend-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}