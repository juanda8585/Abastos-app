version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: my_postgres_container
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      # Mount your local initialization script into the container's init folder
      - ./init-scripts:/docker-entrypoint-initdb.d
      # Named volume to persist data so you don't lose it when the container stops
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_backend_container
    command: node backend/server.js
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=mydatabase
    depends_on:
      - postgres_db
    restart: unless-stopped

volumes:
  postgres_data: